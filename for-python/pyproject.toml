[project]
name = "for-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anshul Chauhan", email = "anshulchauhan@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pytest>=8.3.4",
    "ruff>=0.9.6",
]

[project.scripts]
for-python = "for_python:main"

[tool.pytest.ini_options]
python_files = "*.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
